<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256" shape-rendering="crispEdges">
  <!-- Bridge deck, rising toward the EAST (high edge = east; the west
       edge is the low bridge-end lip meeting the bank). Transpose of
       bridge-rise-s: shaded at the west, lit at the east, lip on the
       west edge, plank columns compressing toward the low (west) end. -->
  <defs>
    <linearGradient id="rise_e_shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140c06" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#140c06" stop-opacity="0.10"/>
      <stop offset="0.62" stop-color="#fff0d2" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff0d2" stop-opacity="0.20"/>
    </linearGradient>
  </defs>
  <!-- planks: narrow at the low (west) end, opening up eastward -->
  <rect x="0" y="7" width="4.4" height="34" fill="#8d6c46"/>
  <rect x="4.4" y="7" width="4.8" height="34" fill="#846440"/>
  <rect x="9.2" y="7" width="5.2" height="34" fill="#93724b"/>
  <rect x="14.4" y="7" width="5.8" height="34" fill="#7f603c"/>
  <rect x="20.2" y="7" width="6.4" height="34" fill="#8a6a45"/>
  <rect x="26.6" y="7" width="6.8" height="34" fill="#8f6e48"/>
  <rect x="33.4" y="7" width="7.2" height="34" fill="#82633e"/>
  <rect x="40.6" y="7" width="7.4" height="34" fill="#8b6b46"/>
  <!-- plank seams -->
  <g fill="#55402a" opacity="0.85">
    <rect x="4.0" y="7" width="0.8" height="34"/>
    <rect x="8.8" y="7" width="0.8" height="34"/>
    <rect x="14.0" y="7" width="0.8" height="34"/>
    <rect x="19.8" y="7" width="0.8" height="34"/>
    <rect x="26.2" y="7" width="0.8" height="34"/>
    <rect x="33.0" y="7" width="0.8" height="34"/>
    <rect x="40.2" y="7" width="0.8" height="34"/>
  </g>
  <!-- stringer rails -->
  <rect x="0" y="7" width="48" height="3" fill="#6b5136"/>
  <rect x="0" y="38" width="48" height="3" fill="#6b5136"/>
  <rect x="0" y="7" width="48" height="1" fill="#5a452c"/>
  <rect x="0" y="40" width="48" height="1" fill="#5a452c"/>
  <!-- incline shading: dark west, lit east -->
  <rect x="0" y="7" width="48" height="34" fill="url(#rise_e_shade)"/>
  <!-- threshold lip at the low (west) edge: dark step + lit riser line -->
  <rect x="0" y="7" width="2.2" height="34" fill="#4a3826"/>
  <rect x="2.2" y="7" width="0.9" height="34" fill="#a3835c"/>
</svg>
