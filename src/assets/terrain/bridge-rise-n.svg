<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256" shape-rendering="crispEdges">
  <!-- Bridge deck, rising toward the NORTH (high edge = north; the south
       edge is the low bridge-end lip meeting the bank). Vertical mirror
       of bridge-rise-s: lit at the top, shaded at the bottom, lip at the
       south edge, plank rows compressing toward the low (south) end. -->
  <defs>
    <linearGradient id="rise_n_shade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#140c06" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#140c06" stop-opacity="0.10"/>
      <stop offset="0.62" stop-color="#fff0d2" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff0d2" stop-opacity="0.20"/>
    </linearGradient>
  </defs>
  <!-- planks: widest at the high (north) end, compressing southward -->
  <rect x="7" y="0" width="34" height="7.4" fill="#8b6b46"/>
  <rect x="7" y="7.4" width="34" height="7.2" fill="#82633e"/>
  <rect x="7" y="14.6" width="34" height="6.8" fill="#8f6e48"/>
  <rect x="7" y="21.4" width="34" height="6.4" fill="#8a6a45"/>
  <rect x="7" y="27.8" width="34" height="5.8" fill="#7f603c"/>
  <rect x="7" y="33.6" width="34" height="5.2" fill="#93724b"/>
  <rect x="7" y="38.8" width="34" height="4.8" fill="#846440"/>
  <rect x="7" y="43.6" width="34" height="4.4" fill="#8d6c46"/>
  <!-- plank seams -->
  <g fill="#55402a" opacity="0.85">
    <rect x="7" y="7.0" width="34" height="0.8"/>
    <rect x="7" y="14.2" width="34" height="0.8"/>
    <rect x="7" y="21.0" width="34" height="0.8"/>
    <rect x="7" y="27.4" width="34" height="0.8"/>
    <rect x="7" y="33.2" width="34" height="0.8"/>
    <rect x="7" y="38.4" width="34" height="0.8"/>
    <rect x="7" y="43.2" width="34" height="0.8"/>
  </g>
  <!-- stringer rails -->
  <rect x="7" y="0" width="3" height="48" fill="#6b5136"/>
  <rect x="38" y="0" width="3" height="48" fill="#6b5136"/>
  <rect x="7" y="0" width="1" height="48" fill="#5a452c"/>
  <rect x="40" y="0" width="1" height="48" fill="#5a452c"/>
  <!-- incline shading: lit north, shaded south -->
  <rect x="7" y="0" width="34" height="48" fill="url(#rise_n_shade)"/>
  <!-- threshold lip at the low (south) edge: lit riser line + dark step -->
  <rect x="7" y="44.9" width="34" height="0.9" fill="#a3835c"/>
  <rect x="7" y="45.8" width="34" height="2.2" fill="#4a3826"/>
</svg>
