<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256" shape-rendering="crispEdges">
  <!-- Bridge deck, flat, east-west travel axis. Transpose of
       bridge-flat-ns: transparent 7px margins top/bottom, planks run
       north-south (across the travel axis), rails ride the deck's
       north/south edges. -->
  <!-- planks (8 columns of 6) -->
  <rect x="0" y="7" width="6" height="34" fill="#8d6c46"/>
  <rect x="6" y="7" width="6" height="34" fill="#846440"/>
  <rect x="12" y="7" width="6" height="34" fill="#93724b"/>
  <rect x="18" y="7" width="6" height="34" fill="#7f603c"/>
  <rect x="24" y="7" width="6" height="34" fill="#8a6a45"/>
  <rect x="30" y="7" width="6" height="34" fill="#8f6e48"/>
  <rect x="36" y="7" width="6" height="34" fill="#82633e"/>
  <rect x="42" y="7" width="6" height="34" fill="#8b6b46"/>
  <!-- plank seams -->
  <g fill="#55402a" opacity="0.85">
    <rect x="5.6" y="7" width="0.8" height="34"/>
    <rect x="11.6" y="7" width="0.8" height="34"/>
    <rect x="17.6" y="7" width="0.8" height="34"/>
    <rect x="23.6" y="7" width="0.8" height="34"/>
    <rect x="29.6" y="7" width="0.8" height="34"/>
    <rect x="35.6" y="7" width="0.8" height="34"/>
    <rect x="41.6" y="7" width="0.8" height="34"/>
  </g>
  <!-- stringer rails -->
  <rect x="0" y="7" width="48" height="3" fill="#6b5136"/>
  <rect x="0" y="38" width="48" height="3" fill="#6b5136"/>
  <rect x="0" y="7" width="48" height="1" fill="#5a452c"/>
  <rect x="0" y="40" width="48" height="1" fill="#5a452c"/>
  <!-- nail heads on the rails at plank centers -->
  <g fill="#54402a">
    <rect x="2.6" y="8" width="1.2" height="1.2"/>
    <rect x="8.6" y="8" width="1.2" height="1.2"/>
    <rect x="14.6" y="8" width="1.2" height="1.2"/>
    <rect x="20.6" y="8" width="1.2" height="1.2"/>
    <rect x="26.6" y="8" width="1.2" height="1.2"/>
    <rect x="32.6" y="8" width="1.2" height="1.2"/>
    <rect x="38.6" y="8" width="1.2" height="1.2"/>
    <rect x="44.6" y="8" width="1.2" height="1.2"/>
    <rect x="2.6" y="38.8" width="1.2" height="1.2"/>
    <rect x="8.6" y="38.8" width="1.2" height="1.2"/>
    <rect x="14.6" y="38.8" width="1.2" height="1.2"/>
    <rect x="20.6" y="38.8" width="1.2" height="1.2"/>
    <rect x="26.6" y="38.8" width="1.2" height="1.2"/>
    <rect x="32.6" y="38.8" width="1.2" height="1.2"/>
    <rect x="38.6" y="38.8" width="1.2" height="1.2"/>
    <rect x="44.6" y="38.8" width="1.2" height="1.2"/>
  </g>
</svg>
