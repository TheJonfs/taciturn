<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420">
  <!--
    Paper grain — a faint fractal-noise tile, laid under the page colour
    to take the flat sheen off the stock. Low alpha so it reads as
    texture, not as dirt. Tiled as a @page background-image.
  -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" stitchTiles="stitch" result="n" />
    <feColorMatrix in="n" type="saturate" values="0" result="g" />
    <feComponentTransfer in="g">
      <feFuncA type="linear" slope="0.085" intercept="0" />
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>
