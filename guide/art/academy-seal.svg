<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Gariland Magic Academy seal">
  <!--
    Academy seal — a geometric, single-colour heraldic mark. Drawn in
    `currentColor` so each spread variant can tint it to its own accent.
    Device: an upright sword (the martial discipline, and Taciturn's
    namesake reticence under arms) ringed by four lozenges for the four
    elemental disciplines — the Knight at the centre, the Mages at the
    cardinal points.
  -->
  <g fill="none" stroke="currentColor" stroke-width="1.6">
    <circle cx="50" cy="50" r="47" />
    <circle cx="50" cy="50" r="39" stroke-width="0.9" />
  </g>

  <!-- Four elemental lozenges, at the cardinal points between the rings. -->
  <g fill="currentColor">
    <path d="M50 39 l4 4 -4 4 -4 -4 z" />
    <path d="M61 50 l-4 4 -4 -4 4 -4 z" />
    <path d="M50 61 l4 4 -4 4 -4 -4 z" />
    <path d="M39 50 l4 4 -4 4 -4 -4 z" />
  </g>

  <!-- The four lozenges at the ring edge, larger, as the outer device. -->
  <g fill="currentColor">
    <path d="M50 3.5 l5 5 -5 5 -5 -5 z" />
    <path d="M96.5 50 l-5 5 -5 -5 5 -5 z" />
    <path d="M50 96.5 l5 5 -5 5 -5 -5 z" />
    <path d="M3.5 50 l5 5 -5 5 -5 -5 z" />
  </g>

  <!-- Upright sword, centred. -->
  <g fill="currentColor">
    <path d="M50 18 l2.6 6 -0.9 30 -3.4 0 -0.9 -30 z" />
    <rect x="40.5" y="53.5" width="19" height="2.8" />
    <rect x="48.7" y="56.3" width="2.6" height="7.5" />
    <circle cx="50" cy="66.4" r="2.7" />
  </g>
</svg>
